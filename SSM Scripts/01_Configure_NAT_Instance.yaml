{
  "schemaVersion": "2.2",
  "description": "Configure NAT instance with IP forwarding and iptables settings using enX0 interface.",
  "mainSteps": [
    {
      "action": "aws:runShellScript",
      "name": "ConfigureNATInstance",
      "inputs": {
        "runCommand": [
          "echo 'net.ipv4.ip_forward=1' | sudo tee /etc/sysctl.d/custom-ip-forwarding.conf",
          "sudo sysctl -p /etc/sysctl.d/custom-ip-forwarding.conf",
          "sudo yum install -y iptables-services",
          "sleep 2",
          "sudo netstat -i",
          "sleep 2",
          "sudo iptables -t nat -A POSTROUTING -o enX0 -j MASQUERADE",
          "sudo iptables -A FORWARD -i eth0 -o enX0 -m state --state RELATED,ESTABLISHED -j ACCEPT",
          "sudo iptables -A FORWARD -i eth0 -o enX0 -j ACCEPT",
          "sleep 2",
          "sudo service iptables save",
          "sudo service iptables restart"
        ]
      }
    }
  ]
}