schemaVersion: "2.2"
description: "Update and upgrade Ubuntu packages, then log the status"
mainSteps:
  - action: "aws:runShellScript"
    name: "UpdateUpgradeSystem"
    inputs:
      runCommand:
        - |
          #!/bin/bash
          set -e

          LOG_FILE="/var/log/update_status.txt"

          # Run update and capture output
          echo "Running apt update..." | tee $LOG_FILE
          if sudo apt update -y >> $LOG_FILE 2>&1; then
              echo "apt update successful" | tee -a $LOG_FILE
          else
              echo "apt update failed" | tee -a $LOG_FILE
          fi

          # Run upgrade and capture output
          echo "Running apt upgrade..." | tee -a $LOG_FILE
          if sudo apt upgrade -y >> $LOG_FILE 2>&1; then
              echo "apt upgrade successful" | tee -a $LOG_FILE
          else
              echo "apt upgrade failed" | tee -a $LOG_FILE
          fi

          echo "Script execution completed at $(date)" | tee -a $LOG_FILE