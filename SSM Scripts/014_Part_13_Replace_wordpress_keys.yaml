{
  "schemaVersion": "2.2",
  "description": "Fetch WordPress security keys and replace them in wp-config.php",
  "mainSteps": [
    {
      "action": "aws:runShellScript",
      "name": "UpdateWordPressKeys",
      "inputs": {
        "runCommand": [
          "LOG_FILE='/var/log/wp_config_update.log'",
          "echo 'Starting WordPress security key update...' | tee -a $LOG_FILE",
          "# Fetch new WordPress security keys",
          "SECURITY_KEYS=$(curl -s https://api.wordpress.org/secret-key/1.1/salt/)",
          "if [ -z \"$SECURITY_KEYS\" ]; then",
          "  echo 'Failed to fetch WordPress security keys' | tee -a $LOG_FILE",
          "  exit 1",
          "fi",
          "echo 'Fetched WordPress security keys successfully.' | tee -a $LOG_FILE",
          "# Backup wp-config.php before modification",
          "sudo cp /var/www/demo/wp-config.php /var/www/demo/wp-config.php.bak",
          "echo 'Backup of wp-config.php created.' | tee -a $LOG_FILE",
          "# Replace old placeholder keys with new security keys",
          "sudo sed -i '/AUTH_KEY/d' /var/www/demo/wp-config.php",
          "sudo sed -i '/SECURE_AUTH_KEY/d' /var/www/demo/wp-config.php",
          "sudo sed -i '/LOGGED_IN_KEY/d' /var/www/demo/wp-config.php",
          "sudo sed -i '/NONCE_KEY/d' /var/www/demo/wp-config.php",
          "sudo sed -i '/AUTH_SALT/d' /var/www/demo/wp-config.php",
          "sudo sed -i '/SECURE_AUTH_SALT/d' /var/www/demo/wp-config.php",
          "sudo sed -i '/LOGGED_IN_SALT/d' /var/www/demo/wp-config.php",
          "sudo sed -i '/NONCE_SALT/d' /var/www/demo/wp-config.php",
          "echo 'Removed old security key placeholders.' | tee -a $LOG_FILE",
          "# Append new security keys to the wp-config.php file",
          "echo \"$SECURITY_KEYS\" | sudo tee -a /var/www/demo/wp-config.php > /dev/null",
          "echo 'Inserted new security keys into wp-config.php.' | tee -a $LOG_FILE",
          "# Verify that keys have been updated",
          "grep 'AUTH_KEY' /var/www/demo/wp-config.php | tee -a $LOG_FILE",
          "echo 'WordPress security keys updated successfully.' | tee -a $LOG_FILE"
        ]
      }
    }
  ]
}